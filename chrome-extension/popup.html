<!doctype html>
<html>
<head>
  <title>Pulsebot</title>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px; height: 520px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc; display: flex; flex-direction: column; overflow: hidden;
    }

    /* Header */
    .header {
      background: #1e1b4b; color: #fff;
      padding: 11px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .header-avatar {
      width: 30px; height: 30px; border-radius: 50%; background: #6366f1;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; overflow: hidden; flex-shrink: 0;
    }
    .header-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .header-info { flex: 1; min-width: 0; }
    .header-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-sub  { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 1px; }
    .header-btn {
      background: none; border: none; color: rgba(255,255,255,.55); cursor: pointer;
      font-size: 15px; padding: 4px; border-radius: 4px; line-height: 1;
    }
    .header-btn:hover { color: #fff; background: rgba(255,255,255,.12); }

    /* Setup screen */
    .setup {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 28px 24px; text-align: center; gap: 12px;
    }
    .setup-icon { font-size: 36px; }
    .setup h2 { font-size: 15px; font-weight: 700; color: #1e1b4b; }
    .setup p  { font-size: 13px; color: #64748b; line-height: 1.55; }
    .btn {
      background: #6366f1; color: #fff; border: none; border-radius: 8px;
      padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn:hover { background: #4f46e5; }

    /* Author bar */
    .author-bar {
      padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #e2e8f0;
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .author-label { font-size: 11px; color: #94a3b8; white-space: nowrap; }
    .author-input {
      flex: 1; border: 1px solid #e2e8f0; border-radius: 6px;
      padding: 4px 8px; font-size: 12px; outline: none; background: #fff;
    }
    .author-input:focus { border-color: #6366f1; }
    .author-go {
      background: #6366f1; color: #fff; border: none; border-radius: 6px;
      padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .author-go:hover { background: #4f46e5; }

    /* Messages */
    .messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 7px; }
    .msg {
      max-width: 90%; padding: 8px 11px; border-radius: 12px;
      font-size: 13px; line-height: 1.5; word-break: break-word; white-space: pre-wrap;
    }
    .msg.user      { background: #6366f1; color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
    .msg.assistant { background: #fff; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .msg.error     { background: #fee2e2; color: #991b1b; align-self: flex-start; }
    .msg.limit     { background: #fef9c3; color: #713f12; align-self: flex-start; }

    .typing { align-self: flex-start; padding: 9px 12px; background: #fff; border-radius: 12px; border-bottom-left-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.08); display: flex; gap: 4px; align-items: center; }
    .typing span { width: 7px; height: 7px; background: #94a3b8; border-radius: 50%; animation: bounce .7s infinite; }
    .typing span:nth-child(2) { animation-delay: .12s; }
    .typing span:nth-child(3) { animation-delay: .24s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }

    .sources { align-self: flex-start; font-size: 11px; color: #94a3b8; padding: 2px 4px; }
    .sources a { color: #6366f1; text-decoration: none; margin-right: 6px; }
    .sources a:hover { text-decoration: underline; }

    /* Input */
    .input-area {
      padding: 8px 10px; background: #fff; border-top: 1px solid #e2e8f0;
      display: flex; gap: 7px; flex-shrink: 0; align-items: flex-end;
    }
    .input-area textarea {
      flex: 1; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 7px 10px; font-size: 13px; resize: none; font-family: inherit;
      outline: none; min-height: 34px; max-height: 88px; overflow-y: auto; line-height: 1.4;
    }
    .input-area textarea:focus { border-color: #6366f1; }
    .send-btn {
      background: #6366f1; color: #fff; border: none; border-radius: 8px;
      width: 34px; height: 34px; cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .send-btn:hover   { background: #4f46e5; }
    .send-btn:disabled { background: #c7d2fe; cursor: not-allowed; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-avatar" id="header-avatar">⚡</div>
    <div class="header-info">
      <div class="header-name" id="header-name">Pulsebot</div>
      <div class="header-sub"  id="header-sub">LinkedIn Newsletter Chat</div>
    </div>
    <button class="header-btn" id="settings-btn" title="Settings">⚙</button>
  </div>

  <!-- Not configured yet -->
  <div class="setup" id="setup-screen">
    <div class="setup-icon">⚡</div>
    <h2>Set up Pulsebot</h2>
    <p>Enter your Pulsebot server URL to start chatting with newsletter archives.</p>
    <button class="btn" id="open-options">Open Settings</button>
  </div>

  <!-- Chat -->
  <div id="chat-screen" hidden>
    <div class="author-bar">
      <span class="author-label">Author:</span>
      <input class="author-input" id="author-input" placeholder="e.g. lenny-rachitsky" />
      <button class="author-go" id="author-go">Go</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <textarea id="q" placeholder="Ask something…" rows="1"></textarea>
      <button class="send-btn" id="send-btn">↑</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
