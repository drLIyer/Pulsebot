<!doctype html>
<html>
<head>
  <title>Pulsebot Settings</title>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 400px; min-height: 280px; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc; color: #1e293b;
    }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .logo-icon { font-size: 22px; }
    h1 { font-size: 17px; font-weight: 700; color: #1e1b4b; }

    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
    input {
      width: 100%; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 8px 12px; font-size: 13px; outline: none; background: #fff;
    }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 2px #e0e7ff; }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }

    .actions { display: flex; gap: 8px; margin-top: 20px; }
    .btn {
      flex: 1; border: none; border-radius: 8px;
      padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-secondary { background: #f1f5f9; color: #374151; }
    .btn-secondary:hover { background: #e2e8f0; }

    .status {
      font-size: 12px; margin-top: 12px; padding: 8px 12px;
      border-radius: 6px; display: none;
    }
    .status.ok  { background: #d1fae5; color: #065f46; display: block; }
    .status.err { background: #fee2e2; color: #991b1b; display: block; }
  </style>
</head>
<body>
  <div class="logo">
    <span class="logo-icon">⚡</span>
    <h1>Pulsebot Settings</h1>
  </div>

  <div class="field">
    <label for="serverUrl">Pulsebot Server URL</label>
    <input id="serverUrl" type="url" placeholder="https://your-pulsebot.com" spellcheck="false" />
    <div class="hint">Where your Pulsebot server is running (include https://)</div>
  </div>

  <div class="field">
    <label for="authorHandle">Default Author Handle</label>
    <input id="authorHandle" placeholder="e.g. lenny-rachitsky" spellcheck="false" />
    <div class="hint">Optional — pre-loads this author when you open the popup</div>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" id="test-btn">Test Connection</button>
    <button class="btn btn-primary" id="save-btn">Save</button>
  </div>
  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
