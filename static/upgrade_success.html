<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulsebot — Upgrade successful</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f9f9f8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e5e3;
    border-radius: 12px;
    padding: 40px 36px;
    text-align: center;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; color: #1a1a1a; }
  p  { font-size: 15px; color: #737373; line-height: 1.6; margin-bottom: 24px; }
  a  {
    display: inline-block;
    padding: 11px 24px;
    background: #2563eb;
    color: #fff;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
  }
  a:hover { background: #1d4ed8; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎉</div>
  <h1>You're all set!</h1>
  <p>Your subscription is active. You now have full access to this newsletter's chatbot.</p>
  <a id="back-link" href="/">Back to chat</a>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const author = params.get('author');
  if (author) {
    document.getElementById('back-link').href = '/c/' + author;
    document.getElementById('back-link').textContent = 'Go to chat';
  }
</script>
</body>
</html>
